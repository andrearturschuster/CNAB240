name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]      # troque para "master" se o seu branch padrão for master
  workflow_dispatch:         # permite rodar manualmente pela aba Actions

permissions:
  contents: read
  pages: write
  id-token: write

# garante que um deploy novo cancele um anterior travado (evita "Timeout reached, aborting!")
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Enviar artefato (site estático na raiz)
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
